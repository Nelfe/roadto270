name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Build is up to date
        run: |
          node tools/build.js
          git diff --exit-code index.html || (echo "index.html is stale: run 'npm run build' and commit" && exit 1)
      - run: node tests/smoke.js
      - run: node tests/comfort.js
      - run: node tests/post.js
      - run: node tests/long.js
      - run: node tests/events.js
      - run: node tests/cand.js
      - run: node tests/media.js
      - run: node tests/donors.js
      - run: node tests/tuto.js
      - run: node tests/mandat.js
      - run: node tests/snapshot.js
      - run: node tools/i18n-extract.js --check
      - name: Telemetry stays silent unless enabled
        run: |
          TELEMETRY_URL=https://example.test/ingest node tools/build.js
          node tests/telemetry.js
          node tools/build.js
      - run: node tests/balance.js 120
