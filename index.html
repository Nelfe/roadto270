<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road to 270">

<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Road to 270</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concept : salle de commandement de campagne. Barre d'état collante, carte en tuiles, tiroir d'actions fixe en bas. */
:root{
  --bg:#e9ecf1; --surface:#ffffff; --surface2:#f1f3f7; --ink:#14213a; --muted:#566178; --line:#cfd5e0;
  --dem:#2b5aa8; --rep:#b53a31; --gold:#b9831b; --good:#2c7a4b; --bad:#b53a31; --focus:#14213a;
  --tu:#c9ccd3; --tu-ink:#14213a; --btn:#14213a; --btn-ink:#ffffff; --scrim:rgba(14,22,40,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --surface:#18202e; --surface2:#202a3b; --ink:#e7ebf3; --muted:#97a3ba; --line:#2d3950;
    --dem:#6f9be3; --rep:#e57a70; --gold:#e0b04a; --good:#58b57d; --bad:#e57a70; --focus:#e7ebf3;
    --tu:#3a4354; --tu-ink:#e7ebf3; --btn:#e7ebf3; --btn-ink:#0f1520; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#18202e; --surface2:#202a3b; --ink:#e7ebf3; --muted:#97a3ba; --line:#2d3950;
  --dem:#6f9be3; --rep:#e57a70; --gold:#e0b04a; --good:#58b57d; --bad:#e57a70; --focus:#e7ebf3;
  --tu:#3a4354; --tu-ink:#e7ebf3; --btn:#e7ebf3; --btn-ink:#0f1520; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 92px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:6px;padding:12px 16px;font-weight:600;min-height:44px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 10px;min-height:38px;font-size:13px}
.btn.full{width:100%}

/* Titre */
#title{padding-block:36px}
#title h1{font-size:64px;color:var(--ink)}
#title h1 span{color:var(--gold)}
.lede{max-width:46ch;color:var(--muted);margin:10px 0 22px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pick.three{grid-template-columns:repeat(3,1fr)}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;text-align:left}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;display:block;letter-spacing:.03em}
.pick .d b{color:var(--dem)} .pick .r b{color:var(--rep)}
.pick small{color:var(--muted)}
.rules{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.rules li{padding-left:14px;border-left:3px solid var(--line)}
.fine{font-size:12px;color:var(--muted);margin-top:22px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.hud .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto}
.hud .wk{min-width:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.hud .cash{white-space:nowrap;font-family:var(--f-mono);font-size:18px;font-weight:500}
.evbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--tu);position:relative;max-width:560px;margin:6px auto 0}
.evbar i{display:block;height:100%}
.evbar .mark{position:absolute;left:50.19%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.evleg{display:flex;justify-content:space-between;font-size:12px;max-width:560px;margin:4px auto 0;font-family:var(--f-mono)}
.evleg b{font-weight:500}

/* Carte */
.map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin:14px 0 6px}
.tile{aspect-ratio:1/1;border:0;border-radius:4px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;line-height:1.05;position:relative;min-width:0}
.tile small{display:none;font-size:8px;opacity:.85}
@media (min-width:430px){.tile small{display:block}.tile{font-size:12px}}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:2}
.tile.tu{background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(127,127,127,.28) 5px 7px)}
.tile .pip{position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.panel h2{font-size:28px}
.panel .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.chip.you{color:var(--ink)} .chip.gd{color:var(--good)} .chip.bd{color:var(--bad)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{text-align:left;line-height:1.2}
.acts .btn small{display:block;font-weight:400;opacity:.8;font-size:12px}
table.bd{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table.bd td{padding:4px 0;border-top:1px solid var(--line)}
table.bd td:last-child{text-align:right;font-family:var(--f-mono)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hint{padding:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:8px;margin-bottom:12px}

/* Enjeux */
.issue{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.issue h3{font-size:22px}
.issue .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.sal{height:6px;background:var(--surface2);border-radius:3px;margin:8px 0;overflow:hidden}
.sal i{display:block;height:100%;background:var(--gold)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:8px 0 2px;border-top:2px solid var(--line)}
.track div{height:30px;display:flex;align-items:center;justify-content:center;gap:3px;position:relative}
.track div::before{content:"";position:absolute;top:-6px;width:2px;height:10px;background:var(--line)}
.dot{width:14px;height:14px;border-radius:50%}
.dot.me{background:var(--me)} .dot.op{border:2.5px solid var(--op);background:transparent}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}
.ends span{max-width:48%}
.ends span:last-child{text-align:right}
.irow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.irow .btn{flex:1;min-width:90px}

/* Actions / journal */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.card h3{font-size:20px}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card .btn{flex:none}
.log{list-style:none;margin:0;padding:0}
.log li{padding:9px 0;border-top:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:44px 1fr;gap:8px}
.log li b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted)}
.log li.opp{color:var(--muted)}
.tog{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:14px}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto}
.dock .go{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:2px 0 6px}
.aps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.aps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);display:inline-block}
.aps i.on{background:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--surface2);padding:3px;border-radius:8px;margin:8px auto 0;max-width:560px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:6px;padding:9px 0 8px;font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:0;color:var(--muted);position:relative;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.tabs .bdg{position:absolute;top:2px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--gold);color:#14213a;font:600 10px/15px var(--f-body);text-align:center;padding:0 3px}
.mixbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin:10px 0 6px;gap:1px}
.mixbar i{display:block;height:100%}
.mixleg{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.mixleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.grp h3{font-size:22px}
.pref{display:grid;grid-template-columns:1fr 1fr;height:8px;background:var(--surface2);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.pref i{display:block;height:100%}
.pref .l{justify-self:end}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.kv span:last-child{font-family:var(--f-mono);text-align:right}
.sect{margin:18px 0 8px;font-size:22px}
.rt{display:flex;align-items:center}
.help{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:600 16px/1 var(--f-body);margin-left:10px;padding:0}
.coach{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;margin-inline:auto;width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));max-width:540px;
  background:var(--surface);border:2px solid var(--gold);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.coach .cn{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.coach h3{font-size:22px;margin:2px 0 4px}
.coach p{margin:0 0 10px;font-size:14px}
.coach .cb{display:flex;gap:8px;justify-content:flex-end}
.hl{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
body.tuto{padding-block:0 330px}
.man details{border-top:1px solid var(--line);padding:6px 0}
.man summary{font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:40px}
.man summary::-webkit-details-marker{display:none}
.man summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.man details[open] summary::after{content:"−"}
.man p,.man li{font-size:14px;margin:4px 0}
.man ul{margin:4px 0 8px;padding-left:18px}
.man b{font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{margin:0!important}

/* Modal */
#modal{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
#modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:12px 12px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal h2{font-size:32px;margin-bottom:8px}
#modal .ch{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:12px;margin-top:8px}
#modal .ch b{display:block}
#modal .ch small{color:var(--muted)}
.res{padding:12px;border-left:4px solid var(--gold);background:var(--surface2);margin:12px 0}
.big{font-family:var(--f-display);font-size:64px;line-height:1;letter-spacing:.02em}
.score{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:50;max-width:90%}
@media (prefers-reduced-motion:no-preference){.tile{transition:background .25s}}
.langsw{display:flex;gap:6px;margin:0 0 14px}
.langsw button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;color:var(--ink)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

:root[data-cb="1"]{--rep:#c4620f;--bad:#c4620f}
@media (prefers-color-scheme: dark){:root[data-cb="1"]:not([data-theme="light"]){--rep:#f0a04b;--bad:#f0a04b}}
:root[data-cb="1"][data-theme="dark"]{--rep:#f0a04b;--bad:#f0a04b}
.btn.alt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.codein{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;min-height:44px;font-family:var(--f-mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{display:flex;gap:8px;margin-top:10px}.slot .btn{flex:1;text-align:left;font-size:14px}
.slot .x{width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:20px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.segm{display:flex;gap:6px}
.chart{width:100%;height:auto;display:block;margin:10px 0 6px}
.ach{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.ach li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.ach li.off{opacity:.5}.ach b{display:block;font-weight:600}
.hs{width:100%;border-collapse:collapse;font-size:13px}.hs td{padding:4px 6px;border-top:1px solid var(--line)}

.pbar{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.pbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .tr{height:14px;border-radius:3px;background:var(--surface2);overflow:hidden}
.pbar .tr i{display:block;height:100%}
.pbar.you .nm{font-weight:600}
.pbar .v{text-align:right;font-family:var(--f-mono)}
.stance{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
.stance div{height:30px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.stance div.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trl{margin:8px 0 12px;padding:0;list-style:none;font-size:14px}
.trl li{padding:2px 0}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pg .btn{text-align:left}.pg small{display:block;font-weight:400;opacity:.85}

.tabs button{padding-left:1px;padding-right:1px;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;grid-column:1/-1}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-height:36px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.staff .btn{text-align:left}
.badge2{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:9px;background:var(--gold);color:#14213a;font-size:11px;line-height:16px;text-align:center}
.pick>*{min-width:0}
#pickMode b{font-size:17px;line-height:1.15}
.pick.three b{font-size:20px}
</style>
</head>
<body>

<div class="wrap" id="title"></div>

<div class="wrap" id="game" hidden>
  <header class="hud" id="hud"><div id="hudTop"></div>
    <nav class="tabs" id="tabsNav" role="tablist"></nav></header>
  <main id="main"></main>
</div>
<div class="dock" id="dock" hidden><div class="in">
  <div class="go"><div class="aps" id="aps"></div><button class="btn" data-act="end" id="endBtn"></button></div>
</div></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div class="coach" id="coach" hidden role="dialog"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let _s=1;
const rnd=()=>{_s=(_s+0x6D2B79F5)>>>0;let z=_s;z=Math.imul(z^z>>>15,z|1);z^=z+Math.imul(z^z>>>7,z|61);return((z^z>>>14)>>>0)/4294967296};
const SEEDS=2176782336;
const codeOf=n=>(n>>>0).toString(36).toUpperCase().padStart(6,'0');
const hashStr=x=>{let h=2166136261;for(const c of x){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)%SEEDS};
const seedFrom=x=>{x=x.trim().toUpperCase();return/^[0-9A-Z]{1,6}$/.test(x)?parseInt(x,36):hashStr(x)};
const dayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const randn=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

/* ---------- Langue ---------- */
let LANG='en';
try{const l=localStorage.getItem('cap270.lang');if(l==='fr'||l==='en')LANG=l}catch(e){}
const FR=()=>LANG==='fr';
let SET={cb:0,txt:0,vib:1};
try{Object.assign(SET,JSON.parse(localStorage.getItem('cap270.set')||'{}'))}catch(e){}
function applySet(){const r=document.documentElement;r.dataset.cb=SET.cb?'1':'0';r.style.zoom=[1,1.12,1.25][SET.txt]||1}

function mixOf(s){
  const[b,l]=DEMO[s.ab],tg=s.tags,rem=1-(b+l)/100;
  let evg=tg.includes('evang')?.34:tg.includes('ag')?.2:.12;if(s.ab==='UT')evg=.35;
  const dip=(tg.includes('urban')?.3:.2)+(s.lean>10?.05:0)-(s.lean<-25?.04:0);
  const sen=tg.includes('retire')?.3:.21,jeu=tg.includes('urban')?.17:.14;
  const ouv=Math.max(.1,1-evg-dip-sen-jeu)*(tg.includes('rust')?1.25:1);
  const k=rem/(evg+dip+sen+jeu+ouv);
  return[ouv*k,dip*k,sen*k,jeu*k,l/100,b/100,evg*k];
}
function adjOf(s){
  const a=ISSUES.map(()=>s.lean/30),tg=s.tags,add=(id,v)=>{a[ISSUES.findIndex(i=>i.id===id)]+=v};

  return a;
}

function oppTurn(){
  const o=-G.me,wl=12-G.wk+1,pub=[];
  G.cashO+=(trO().includes('funds')?1.5:0)+7+(G.diff===0?-.5:G.diff===2?PARAM.oppHard:0)+PARAM.oppIncome+rnd()*3;
  const ad=PARAM.adapt*[0,.5,1][G.diff],push=s=>clamp(s.adsP/(2+s.ev*.15),0,1.5)+.4*s.fieldP+.3*s.buzzP;
  const sc=G.states.map(s=>{const adv=o*margin(s)+randn()*2;
    return{s,adv,pu:push(s),w:(adv>-14&&adv<9)?valOf(s)*(1+ad*push(s))/(1+Math.pow(Math.max(0,Math.abs(adv)-1)/5,2)):0}}).sort((a,b)=>b.w-a.w);
  const top=sc.slice(0,7).filter(x=>x.w>0),tw=top.reduce((a,x)=>a+x.w,0)||1;
  if(ad>0){const hot=top.filter(x=>x.pu>.7).slice(0,2);if(hot.length)pub.push(both(()=>t(`L’adversaire riposte à votre offensive en ${hot.map(x=>sn(x.s)).join(', ')}.`,`Your opponent hits back at your push in ${hot.map(x=>sn(x.s)).join(', ')}.`)))}
  const budget=Math.max(0,Math.min(G.cashO-1,G.cashO/wl*1.25));let spent=0;const ads=[];
  top.forEach(x=>{const share=budget*x.w/tw,u=share/adCost(x.s);if(u>.2){x.s.adsO+=u;spent+=share;ads.push([x.s,share])}});
  if(ads.length){ads.sort((a,b)=>b[1]-a[1]);const tot=ads.reduce((a,x)=>a+x[1],0),names=ads.slice(0,3).map(x=>x[0]);
    pub.push(both(()=>t(`Campagne TV adverse (≈ ${fM(tot)}) surtout en ${names.map(sn).join(', ')}.`,`Opposing TV campaign (≈ ${fM(tot)}) mainly in ${names.map(sn).join(', ')}.`)))}
  if(G.wk<=8)top.slice(0,4).forEach(x=>{if(x.s.fieldO<2&&G.cashO-spent>fcost(x.s,false)+5){x.s.fieldO++;spent+=fcost(x.s,false);pub.push(both(()=>t(`L’adversaire ouvre un bureau de campagne en ${sn(x.s)}.`,`Your opponent opens a campaign office in ${sn(x.s)}.`)))}});
  const v=top.slice(0,4).sort(()=>rnd()-.5).slice(0,2);
  v.forEach(x=>{x.s.buzzO=Math.min(2.4,x.s.buzzO+1.3);spent+=.3;pub.push(both(()=>t(`Meeting de l’adversaire en ${sn(x.s)}.`,`Opponent rally in ${sn(x.s)}.`)))});
  G.cashO=Math.max(0,G.cashO-spent-.08*G.states.reduce((a,s)=>a+s.fieldO*fieldCost(s),0));G.spentO+=spent;
  if(rnd()<.5&&G.cashO-spent>3){let gi=bestGroup(oside(),true);
    if(ad>0&&rnd()<.6*ad){const mx=Math.max(...G.tgtP);if(mx>.5)gi=G.tgtP.indexOf(mx)}G.tgtO[gi]=Math.min(2,G.tgtO[gi]+1);spent+=1.5;if(rnd()<.5)pub.push(both(()=>t(`Campagne de l’adversaire auprès des ${t(GROUPS[gi].n).toLowerCase()}.`,`Opponent outreach to ${t(GROUPS[gi].n).toLowerCase()}.`)))}
  if(G.wk>=8)top.slice(0,3).forEach(x=>{if(x.s.ebO<3&&rnd()<.5&&G.cashO-spent>2){x.s.ebO++;spent+=1.5}});
  if(PARAM.pivotWeeks.includes(G.wk))oppPivot(pub);
  else if(ad>0&&(G.posMoves||0)>(G.posSeen||0)&&rnd()<.5*ad){G.posSeen=G.posMoves;oppPivot(pub)}
  pub.forEach(x=>L('opp',x));
}
function bestShift(sd){
  const pos=G.pos[sd].slice();
  const bg=G.states.filter(s=>Math.abs(margin(s))<8),bev=bg.reduce((a,s)=>a+s.ev,0)||1;
  let best=null;
  ISSUES.forEach((is,i)=>[-1,1].forEach(d=>{const np=clamp(pos[i]+d,-2,2);if(np===pos[i])return;
    const tr=pos.slice();tr[i]=np;let g=0;
    bg.forEach(s=>{const a=issueEff(s,sd==='D'?tr:G.pos.D,sd==='R'?tr:G.pos.R),b=issueEff(s,G.pos.D,G.pos.R);g+=(sd==='D'?1:-1)*(a-b)*s.ev});
    g/=bev;const df=sd==='D'?is.dD:is.dR;g-=.25*is.s0*(Math.abs(np-df)-Math.abs(pos[i]-df));
    if(!best||g>best.g)best={i,np,g}}));
  return best;
}
function bestGroup(sd,rr){
  const bg=G.states.filter(s=>Math.abs(margin(s))<8),sc=GROUPS.map((q,gi)=>({gi,v:bg.reduce((a,s)=>a+s.ev*s.mix[gi],0)*(1+Math.max(0,groupPref(gi,sd)))*(1+(rr?rnd()*.4:0))}));
  return sc.sort((a,b)=>b.v-a.v)[0].gi;
}
function oppPivot(pub){
  const osd=oside(),best=bestShift(osd);
  if(best&&best.g>PARAM.pivotMin){G.pos[osd][best.i]=best.np;const nm=ISSUES[best.i].n;pub.push(B(`L’adversaire ajuste sa position sur « ${nm.fr} ».`,`Your opponent adjusts its position on “${nm.en}”.`))}
}

  G.cash+=PARAM.income+(trP().includes('funds')?1.5:0)+.3*sk('fin')-staffCost()-.08*G.states.reduce((a,s)=>a+s.fieldP*fieldCost(s),0);
  G.cash=Math.max(0,G.cash);
  oppTurn();
  G.states.forEach(s=>{s.tvP*=.85;s.dgP*=.72;s.raP*=.9;s.adsP=s.tvP+s.dgP+s.raP;s.adsO*=.85;s.buzzP*=.5;s.buzzO*=.5;s.noise=randn()*1.2;s.internal=null;s.shock*=.88});
  G.tgtP=G.tgtP.map(v=>v*.75);G.tgtO=G.tgtO.map(v=>v*.75);
  G.econ=clamp(G.econ*.9+randn()*.18,-3,3);
  G.env+=randn()*.25;G.sal=G.sal.map((v,i)=>v+(S0[i]-v)*.12);

  const m1=G.me===1,hM=m1?hD:hR,hO=m1?hR:hD,sM=m1?sD:sR,sO=m1?sR:sD;

  else{
    const R=G.res,sw=side(),hw=R.hCtl===sw,sc=R.sCtl===sw,won=(hw?1:0)+(sc?1:0);
    const win=G.win!=null?G.win:(G.win=hw),newA=G.rec?(G.newA||[]):finishMid(win,won,hM,sM);

<li>You choose among <b>3 generated candidates</b>: two strengths and one weakness each (image, funds, cheaper offices, debates, home turf; risky interviews, baggage, low name ID).</li>

<li>Primary voters have a <b>mood</b>, shown under the polls. Positioning near it helps, but your stance shifts your issue positions once you are nominated.</li>
<li>Attacking weakens a rival but costs image against your general-election opponent. Money left over carries into the general campaign.</li>
<li>If you do not finish first in delegates, your campaign ends.</li></ul></details>
<details><summary>Reading the map and polls</summary><ul>
<li><b>Colors:</b> blue for Democrats, red for Republicans. The darker, the bigger the gap. Hatched: under 1.5 points, a toss-up.</li>
<li><b>Polls:</b> noisy, with a bias shared across the whole country. One event lets you audit that bias.</li>
<li><b>Internal poll ($1M):</b> gives the state’s true margin for the week.</li>
<li><b>Top bar:</b> projection for your side, your opponent and toss-up states. The line marks 270.</li>
<li><b>Gold dot on a tile:</b> you have a campaign office there.</li>
<li>Starting margins come from the 2024 results, recalibrated so that the race is open.</li></ul></details>
<details><summary>Actions in a state</summary><ul>
<li><b>Ads:</b> cost $0.8M plus $0.1M per electoral vote. Up to about +3 points, with diminishing returns. The effect fades 15% each week.</li>
<li><b>Field office:</b> 1 action and money. Up to 3 per state, about +0.6, +1.0 then +1.4 points in total. Lasting effect, but upkeep costs money every week.</li>
<li><b>Visit:</b> 1 action and $0.3M. +1.3 points of buzz, halved each week.</li>
<li>Your opponent has the same levers: what matters is the net gap between you.</li></ul></details>
<details><summary>National actions</summary><ul>
<li><b>Fundraising:</b> 1 action for $4M to $7M, a bit more with a good image.</li>
<li><b>Major interview:</b> most often good for your image, sometimes no effect, rarely a slip.</li>
<li><b>Debate prep:</b> up to 3 levels, used at the week 5 and week 9 debates, then reset to zero.</li>
<li><b>Running mate:</b> chosen at the start, brings a regional bonus, image or funds.</li></ul></details>
<details><summary>Issues and positions</summary><ul>
<li>Ten issues, each with an <b>importance</b> (gold bar) and a <b>position</b> from −2 to +2.</li>
<li>Changing a position or putting an issue on the agenda costs 1 action.</li>
<li>Each state reacts according to its population. Moving toward a state’s voters wins you points there but costs you elsewhere.</li>
<li>Moving away from your party’s line demobilizes your base a little, everywhere.</li>
<li>When an issue gains importance, it favors the side associated with it: health care, abortion and climate lean Democratic; immigration, crime and the economy lean Republican.</li></ul></details>
<details><summary>Voter groups</summary><ul>
<li>Seven groups. Each state has its own makeup, shown in its panel.</li>
<li>Each group has its priorities and prefers a side depending on your positions (Groups tab).</li>
<li><b>Targeting a group:</b> 1 action and $1.5M. The bonus applies in each state according to the group’s local weight, then fades 25% per week. Your opponent does it too.</li></ul></details>
<details><summary>Economy</summary><ul>
<li>National conditions and each state’s economy (sector, unemployment) both matter.</li>
<li>A good economy helps the <b>incumbent party</b>, a bad one helps its challenger. The incumbent party is shown in the Groups tab.</li>
<li>Energy and manufacturing react more strongly than services. Events can hit a sector.</li></ul></details>
<details><summary>Events, image, debates</summary><ul>
<li>Each week, an event asks for a choice, often with a cost or a risk.</li>
<li>Your <b>image</b> against your opponent moves every state a little.</li>
<li>Two debates (weeks 5 and 9) and a last-minute revelation (week 11).</li></ul></details>
<details><summary>Campaign staff</summary><ul>
<li>The <b>Team</b> tab lets you hire 5 staffers: campaign manager, pollster, field director, communications, finance. Each has a level (I to III) and a weekly salary.</li>
<li>Hiring costs one week of salary up front. A higher level costs more: it is up to you to judge whether the effect pays for the salary.</li></ul></details>
<details><summary>Media, storms and early voting</summary><ul>
<li><b>Ad channels:</b> TV works everywhere and lasts longer; digital is 20% cheaper but fades fast and suits young and college-educated voters; local radio costs half as much and suits rural areas, Black and evangelical voters. The multipliers (×) show how well each channel fits the state.</li>
<li><b>Storms:</b> each week may bring a viral story (for or against you). Responding (1 action) limits the damage or amplifies the benefit.</li>
<li><b>Early voting:</b> from week 8, a drive (1 action, $2M) banks a lasting bonus in a state, up to 3 times. It counts more where seniors and college graduates dominate. Your opponent does it too.</li></ul></details>
<details><summary>Independent candidate and districts</summary><ul>
<li>In some games an independent enters around weeks 3 to 5 and takes votes from one side, then fades. If it hurts you, you can court its voters or urge strategic voting.</li>
<li>Maine and Nebraska split their electoral votes: 2 for the statewide winner, 1 per district. The state panel shows the margin in each district.</li></ul></details>
<details><summary>Midterms mode (House and Senate)</summary><ul>
<li>You run your party’s national campaign. There are no candidates, primaries or debates.</li>
<li>Each state elects several <b>House seats</b> (the number is shown on the map); states marked ★ also hold a <b>Senate election</b>. Seats not up for election (34 Democratic, 31 Republican) are already counted.</li>
<li>You need <b>218 House seats</b> to win. Taking the <b>Senate</b> too (51 seats; 50 is enough for the president’s party, the vice-president breaking ties) is a total victory.</li>
<li>The president’s party is usually penalized. Your levers (ads, offices, issues, groups, staff) work as in the presidential game, but count for every seat in the state. An incumbent Senate seat is a little easier to hold.</li>
<li>Incumbent Senate seats are a little easier to hold, and the Senate map structurally favors Republicans.</li></ul></details>
<details><summary>Tips</summary><ul>
<li>Focus on 6 to 8 close states, weighted by electoral votes.</li>
<li>Avoid investing in states that are locked or lost by more than 10 points.</li>
<li>Fundraise regularly and spend everything before election day.</li>
<li>Pay for an internal poll before a big investment.</li>
<li>Watch the Log: your opponent’s public actions appear there.</li>
<li>In the Log, “Show detailed calculations” breaks down each state’s margin.</li></ul></details>
<details><summary>Difficulty</summary><p>On Easy, the national mood favors you. On Hard, it works against you and your opponent has more money.</p></details>`+foot;
}

  if(G.daily){S.dl=S.dl||{};S.dl[G.daily]=win?1:0}

  const mn=Math.min(999,...(G.hist||[]).filter(h=>h.w>=4&&h.w<=8).map(h=>h.y));
  const c={win,mine,diff:G.diff,flips,cash:G.cash,mn,daily:!!G.daily,S},got=[];
  ACH.forEach(a=>{if(!S.ach[a.id]&&a.ck(c)){S.ach[a.id]=Date.now();got.push(a.id)}});

}

  <div class="pick" id="pickMode"><button data-mode="pres" aria-pressed="${pickedMode==='pres'}"><b>${t('Présidentielle 2028','Presidential 2028')}</b><small>${t('270 grands électeurs','270 electoral votes')}</small></button><button data-mode="mid" aria-pressed="${pickedMode==='mid'}"><b>${t('Midterms 2030','Midterms 2030')}</b><small>${t('Chambre et Sénat','House and Senate')}</small></button></div>
  <p class="lede">${pickedMode==='mid'?t('Douze semaines pour conquérir le Congrès. Vous dirigez la campagne nationale de votre parti : vous répartissez votre argent et votre temps entre 435 sièges de la Chambre et 35 courses au Sénat, face à un adversaire qui fait de même. Données calées sur les résultats de 2024.','Twelve weeks to win Congress. You run your party’s national campaign, splitting money and time across 435 House seats and 35 Senate races, against an opponent doing the same. Data calibrated on the 2024 results.'):t('Douze semaines pour gagner la présidentielle américaine. Vous répartissez votre argent et votre temps entre les États clés, vous choisissez vos positions et vous affrontez un adversaire qui fait de même. Candidats fictifs, données calées sur les résultats de 2024.','Twelve weeks to win the US presidency. You split your money and time across the key states, choose your positions and face an opponent doing the same. Fictional candidates, data calibrated on the 2024 results.')}</p>
  <div class="pick" id="pickSide">
    <button class="d" data-side="1" aria-pressed="${pickedSide===1}"><b>${t('Démocrate','Democrat')}</b><small>${pickedMode==='mid'?t('Direction de campagne nationale','National campaign chief'):t('Candidat tiré au hasard','Randomly drawn candidate')}</small></button>
    <button class="r" data-side="-1" aria-pressed="${pickedSide===-1}"><b>${t('Républicain','Republican')}</b><small>${pickedMode==='mid'?t('Direction de campagne nationale','National campaign chief'):t('Candidat tiré au hasard','Randomly drawn candidate')}</small></button>
  </div>
  <div class="pick three" id="pickDiff">
    <button data-diff="0" aria-pressed="${pickedDiff===0}"><b>${t('Facile','Easy')}</b><small>${t('Vent dans le dos','Tailwind')}</small></button>
    <button data-diff="1" aria-pressed="${pickedDiff===1}"><b>Normal</b><small>${t('Course équilibrée','Even race')}</small></button>
    <button data-diff="2" aria-pressed="${pickedDiff===2}"><b>${t('Difficile','Hard')}</b><small>${t('Vent de face','Headwind')}</small></button>
  </div>
  <input class="codein" id="codeIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${t('Code de partie (facultatif)','Game code (optional)')}" aria-label="${t('Code de partie','Game code')}">
  <button class="btn full" data-act="start">${t('Lancer la campagne','Start the campaign')}</button>
  <button class="btn alt full" data-act="daily" style="margin-top:10px">${t('Défi du jour','Daily challenge')} · ${dayStr()}${dl===1?' ✓':dl===0?' ✗':''}</button>
  ${saves.map(sv=>`<div class="slot"><button class="btn alt" data-act="cont" data-slot="${sv.slot}">${t('Reprendre','Resume')} : ${slotLabel(sv)}</button><button class="x" data-act="del" data-slot="${sv.slot}" aria-label="${t('Supprimer','Delete')}">×</button></div>`).join('')}
  <div class="trio"><button class="btn alt sm" data-act="help">${t('Comment jouer','How to play')}</button><button class="btn alt sm" data-act="stats">${t('Statistiques','Stats')}</button><button class="btn alt sm" data-act="settings">${t('Réglages','Settings')}</button></div>
  <ul class="rules">
    ${pickedMode==='mid'?'':`<li>${t('Vous choisissez parmi trois candidats générés, puis vous gagnez les primaires avant d’affronter l’adversaire.','You choose among three generated candidates, then win the primaries before facing your opponent.')}</li>`}
    <li>${t('Chaque semaine : 3 actions (visites, collecte, positions) et de l’argent (publicité, bureaux de terrain).','Each week: 3 actions (visits, fundraising, positions) and money (ads, field offices).')}</li>
    <li>${t('Les sondages sont bruités et peuvent se tromper dans le même sens partout. Un sondage interne coûte 1 M$ et donne la vraie marge.','Polls are noisy and can all miss in the same direction. An internal poll costs $1M and shows the true margin.')}</li>
    <li>${t('Vos positions sur les enjeux déplacent les États différemment : se recentrer gagne le Wisconsin et peut perdre la Californie.','Your positions on the issues move each state differently: moving to the center can win Wisconsin and lose California.')}</li>
    <li>${t('Sept groupes d’électeurs pèsent différemment selon les États, et l’économie locale joue en faveur ou contre le parti sortant.','Seven voter groups weigh differently from state to state, and the local economy helps or hurts the incumbent party.')}</li>
    <li>${pickedMode==='mid'?t('Il faut 218 sièges sur 435 à la Chambre pour gagner ; le Sénat (51 sur 100, 50 pour le parti du président) donne la victoire totale.','You need 218 of 435 House seats to win; the Senate (51 of 100, 50 for the president’s party) makes it a total victory.'):t('Il faut 270 grands électeurs sur 538. Le Maine et le Nebraska répartissent les leurs par district.','You need 270 of 538 electoral votes. Maine and Nebraska split theirs by district.')}</li>
  </ul>
  <p class="fine">${t('Prototype jouable. Les marges de fond sont des approximations arrondies de 2024. Tous les candidats sont fictifs.','Playable prototype. Baseline margins are rounded approximations of 2024. All candidates are fictional.')}</p>`;
}
document.addEventListener('click',e=>{
  const mb=e.target.closest('#pickMode button');if(mb){pickedMode=mb.dataset.mode;const cv=$('#codeIn')?$('#codeIn').value:'';renderTitle();if(cv)$('#codeIn').value=cv;return}
  const sb=e.target.closest('#pickSide button');if(sb){pickedSide=+sb.dataset.side;document.querySelectorAll('#pickSide button').forEach(b=>b.setAttribute('aria-pressed',b===sb));return}
  const db=e.target.closest('#pickDiff button');if(db){pickedDiff=+db.dataset.diff;document.querySelectorAll('#pickDiff button').forEach(b=>b.setAttribute('aria-pressed',b===db));return}
  const x=e.target.closest('[data-act]');if(!x)return;const a=x.dataset.act;
  if(a==='start'){const v=($('#codeIn')?.value||'').trim();newGame(pickedSide,pickedDiff,v?seedFrom(v):null,null,pickedMode);render();if(G.mode==='mid')showBrief();return}
  if(a==='cont'){const sv=loadSaves().find(q=>q.slot===+x.dataset.slot);if(sv){G=sv;G.hist=G.hist||[];if(G.rs)_s=G.rs>>>0;UI={tab:'map',sel:null,night:null};render();if(G.phase==='vp')showBrief();else if(G.phase==='event')showEvent();else if(G.phase==='over'){UI.night={idx:G.order.length};nightTick()}}return}
  if(SET.vib&&['ads','field','visit','poll','pos','agenda','fund','media','prep','target','end','choose','vp'].includes(a))navigator.vibrate?.(a==='end'?20:8);
  A[a]&&A[a](x.dataset);
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(G)render()});
applySet();applyStatic();renderTitle();
</script>

<script>if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
