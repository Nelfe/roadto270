<html lang="en">
<head>

<title>Road to 270</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Concept : salle de commandement de campagne. Barre d'état collante, carte en tuiles, tiroir d'actions fixe en bas. */
:root{
  --bg:#e9ecf1; --surface:#ffffff; --surface2:#f1f3f7; --ink:#14213a; --muted:#566178; --line:#cfd5e0;
  --dem:#2b5aa8; --rep:#b53a31; --gold:#b9831b; --good:#2c7a4b; --bad:#b53a31; --focus:#14213a;
  --tu:#c9ccd3; --tu-ink:#14213a; --btn:#14213a; --btn-ink:#ffffff; --scrim:rgba(14,22,40,.55);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --surface:#18202e; --surface2:#202a3b; --ink:#e7ebf3; --muted:#97a3ba; --line:#2d3950;
    --dem:#6f9be3; --rep:#e57a70; --gold:#e0b04a; --good:#58b57d; --bad:#e57a70; --focus:#e7ebf3;
    --tu:#3a4354; --tu-ink:#e7ebf3; --btn:#e7ebf3; --btn-ink:#0f1520; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#18202e; --surface2:#202a3b; --ink:#e7ebf3; --muted:#97a3ba; --line:#2d3950;
  --dem:#6f9be3; --rep:#e57a70; --gold:#e0b04a; --good:#58b57d; --bad:#e57a70; --focus:#e7ebf3;
  --tu:#3a4354; --tu-ink:#e7ebf3; --btn:#e7ebf3; --btn-ink:#0f1520; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 92px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:6px;padding:12px 16px;font-weight:600;min-height:44px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:8px 10px;min-height:38px;font-size:13px}
.btn.full{width:100%}

/* Titre */
#title{padding-block:36px}
#title h1{font-size:64px;color:var(--ink)}
#title h1 span{color:var(--gold)}
.lede{max-width:46ch;color:var(--muted);margin:10px 0 22px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pick.three{grid-template-columns:repeat(3,1fr)}
.pick button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;text-align:left}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;display:block;letter-spacing:.03em}
.pick .d b{color:var(--dem)} .pick .r b{color:var(--rep)}
.pick small{color:var(--muted)}
.rules{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.rules li{padding-left:14px;border-left:3px solid var(--line)}
.fine{font-size:12px;color:var(--muted);margin-top:22px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.hud .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto}
.hud .wk{min-width:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.hud .cash{white-space:nowrap;font-family:var(--f-mono);font-size:18px;font-weight:500}
.evbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--tu);position:relative;max-width:560px;margin:6px auto 0}
.evbar i{display:block;height:100%}
.evbar .mark{position:absolute;left:50.19%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.evleg{display:flex;justify-content:space-between;font-size:12px;max-width:560px;margin:4px auto 0;font-family:var(--f-mono)}
.evleg b{font-weight:500}

/* Carte */
.map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin:14px 0 6px}
.tile{aspect-ratio:1/1;border:0;border-radius:4px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;line-height:1.05;position:relative;min-width:0}
.tile small{display:none;font-size:8px;opacity:.85}
@media (min-width:430px){.tile small{display:block}.tile{font-size:12px}}
.tile.sel{outline:3px solid var(--ink);outline-offset:1px;z-index:2}
.tile.tu{background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(127,127,127,.28) 5px 7px)}
.tile .pip{position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.panel h2{font-size:28px}
.panel .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}
.chip.you{color:var(--ink)} .chip.gd{color:var(--good)} .chip.bd{color:var(--bad)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{text-align:left;line-height:1.2}
.acts .btn small{display:block;font-weight:400;opacity:.8;font-size:12px}
table.bd{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table.bd td{padding:4px 0;border-top:1px solid var(--line)}
table.bd td:last-child{text-align:right;font-family:var(--f-mono)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hint{padding:14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:8px;margin-bottom:12px}

/* Enjeux */
.issue{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.issue h3{font-size:22px}
.issue .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.sal{height:6px;background:var(--surface2);border-radius:3px;margin:8px 0;overflow:hidden}
.sal i{display:block;height:100%;background:var(--gold)}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:8px 0 2px;border-top:2px solid var(--line)}
.track div{height:30px;display:flex;align-items:center;justify-content:center;gap:3px;position:relative}
.track div::before{content:"";position:absolute;top:-6px;width:2px;height:10px;background:var(--line)}
.dot{width:14px;height:14px;border-radius:50%}
.dot.me{background:var(--me)} .dot.op{border:2.5px solid var(--op);background:transparent}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}
.ends span{max-width:48%}
.ends span:last-child{text-align:right}
.irow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.irow .btn{flex:1;min-width:90px}

/* Actions / journal */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.card h3{font-size:20px}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.card .btn{flex:none}
.log{list-style:none;margin:0;padding:0}
.log li{padding:9px 0;border-top:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:44px 1fr;gap:8px}
.log li b{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted)}
.log li.opp{color:var(--muted)}
.tog{display:flex;gap:10px;align-items:center;margin:14px 0;font-size:14px}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:560px;margin:0 auto}
.dock .go{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:2px 0 6px}
.aps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.aps i{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);display:inline-block}
.aps i.on{background:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--surface2);padding:3px;border-radius:8px;margin:8px auto 0;max-width:560px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:6px;padding:9px 0 8px;font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:0;color:var(--muted);position:relative;min-width:0;overflow:hidden;text-overflow:clip;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.tabs .bdg{position:absolute;top:2px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--gold);color:#14213a;font:600 10px/15px var(--f-body);text-align:center;padding:0 3px}
.mixbar{display:flex;height:10px;border-radius:3px;overflow:hidden;margin:10px 0 6px;gap:1px}
.mixbar i{display:block;height:100%}
.mixleg{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.mixleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}
.grp h3{font-size:22px}
.pref{display:grid;grid-template-columns:1fr 1fr;height:8px;background:var(--surface2);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.pref i{display:block;height:100%}
.pref .l{justify-self:end}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.kv span:last-child{font-family:var(--f-mono);text-align:right}
.sect{margin:18px 0 8px;font-size:22px}
.rt{display:flex;align-items:center}
.help{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:600 16px/1 var(--f-body);margin-left:10px;padding:0}
.coach{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;margin-inline:auto;width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));max-width:540px;
  background:var(--surface);border:2px solid var(--gold);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.coach .cn{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.coach h3{font-size:22px;margin:2px 0 4px}
.coach p{margin:0 0 10px;font-size:14px}
.coach .cb{display:flex;gap:8px;justify-content:flex-end}
.hl{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
body.tuto{padding-block:0 330px}
.man details{border-top:1px solid var(--line);padding:6px 0}
.man summary{font-family:var(--f-display);font-size:21px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:40px}
.man summary::-webkit-details-marker{display:none}
.man summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
.man details[open] summary::after{content:"−"}
.man p,.man li{font-size:14px;margin:4px 0}
.man ul{margin:4px 0 8px;padding-left:18px}
.man b{font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{margin:0!important}

/* Modal */
#modal{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;overflow:auto}
#modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:100%;overflow:auto;border-radius:12px 12px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal h2{font-size:32px;margin-bottom:8px}
#modal .ch{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:12px;margin-top:8px}
#modal .ch b{display:block}
#modal .ch small{color:var(--muted)}
.res{padding:12px;border-left:4px solid var(--gold);background:var(--surface2);margin:12px 0}
.big{font-family:var(--f-display);font-size:64px;line-height:1;letter-spacing:.02em}
.score{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:50;max-width:90%}
@media (prefers-reduced-motion:no-preference){.tile{transition:background .25s}}
.langsw{display:flex;gap:6px;margin:0 0 14px}
.langsw button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:14px;color:var(--ink)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

:root[data-cb="1"]{--rep:#c4620f;--bad:#c4620f}
@media (prefers-color-scheme: dark){:root[data-cb="1"]:not([data-theme="light"]){--rep:#f0a04b;--bad:#f0a04b}}
:root[data-cb="1"][data-theme="dark"]{--rep:#f0a04b;--bad:#f0a04b}
.btn.alt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.codein{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;min-height:44px;font-family:var(--f-mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{display:flex;gap:8px;margin-top:10px}.slot .btn{flex:1;text-align:left;font-size:14px}
.slot .x{width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:20px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.segm{display:flex;gap:6px}
.chart{width:100%;height:auto;display:block;margin:10px 0 6px}
.ach{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}
.ach li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.ach li.off{opacity:.5}.ach b{display:block;font-weight:600}
.hs{width:100%;border-collapse:collapse;font-size:13px}.hs td{padding:4px 6px;border-top:1px solid var(--line)}

.pbar{display:grid;grid-template-columns:104px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.pbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .tr{height:14px;border-radius:3px;background:var(--surface2);overflow:hidden}
.pbar .tr i{display:block;height:100%}
.pbar.you .nm{font-weight:600}
.pbar .v{text-align:right;font-family:var(--f-mono)}
.stance{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
.stance div{height:30px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.stance div.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trl{margin:8px 0 12px;padding:0;list-style:none;font-size:14px}
.trl li{padding:2px 0}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pg .btn{text-align:left}.pg small{display:block;font-weight:400;opacity:.85}

.tabs button{padding-left:1px;padding-right:1px;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;grid-column:1/-1}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-height:36px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.staff .btn{text-align:left}
.badge2{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:9px;background:var(--gold);color:#14213a;font-size:11px;line-height:16px;text-align:center}
.pick>*{min-width:0}
#pickMode b{font-size:17px;line-height:1.15}
.pick.three b{font-size:20px}
html[lang="es"] .tabs button{font-size:10.5px;letter-spacing:-.2px}
html[lang="es"] #title h1{font-size:44px}
html[lang="es"] .pick b{font-size:16px;letter-spacing:0}
/* animations */
.tile{transition:transform .12s}.tile:active{transform:scale(.93)}
.tile.pulse{animation:tpulse .7s ease-out;z-index:3}
@keyframes tpulse{0%{transform:scale(1);filter:brightness(1.6)}35%{transform:scale(1.22)}100%{transform:scale(1);filter:none}}
.sheet{animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
html[data-anim="0"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="title"></div>

<div class="wrap" id="game" hidden>

</div></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
'use strict';
const ST_RAW=[["AK","Alaska",3,-13,0,0,"energy"],

["MN","Minnesota",10,4,2,4,"rust ag"],
["IL","Illinois",19,11,2,5,"urban rust"],
["WI","Wisconsin",10,-0.9,2,6,"rust ag"],
["MI","Michigan",15,-1.4,2,7,"rust"],
["NY","New York",28,13,2,8,"urban"],
["RI","Rhode Island",4,14,2,9,""],
["MA","Massachusetts",11,25,2,10,"urban"],
["OR","Oregon",8,14,3,0,"urban"],
["NV","Nevada",6,-3,3,1,"retire urban"],
["WY","Wyoming",3,-47,3,2,"energy"],

const HELP_ES="<details open><summary>Objetivo y desarrollo</summary><p>Diriges una campaña presidencial ficticia de 12 semanas, del 14 de agosto al 7 de noviembre de 2028. Necesitas al menos <b>270 de los 538 votos electorales</b>.</p>\n<ul><li>Cada semana, gastas tus <b>3 acciones</b> y tu dinero.</li><li>Terminas la semana: tu rival juega, la economía se mueve y un suceso te pide que elijas.</li><li>La noche electoral, los resultados llegan estado por estado con algo de azar: las encuestas pueden equivocarse.</li></ul></details>\n<details><summary>Candidatos y primarias</summary><ul>\n<li>Eliges entre <b>3 candidatos generados</b>: dos puntos fuertes y un punto débil cada uno (imagen, fondos, oficinas más baratas, debates, feudo propio; entrevistas arriesgadas, lastre, poca notoriedad).</li>\n<li>Las <b>primarias</b> son 4 contiendas (el Super Martes cuenta más). Tienes 2 acciones por ronda: movilizar a la base o seducir al centro, anuncios (4 M$), gira de actos, recaudar fondos, atacar a un rival.</li>\n<li>Los votantes de las primarias tienen un <b>estado de ánimo</b>, que se muestra bajo las encuestas. Acercarte a él ayuda, pero tu postura desplaza tus posiciones en los temas una vez que eres el candidato.</li>\n<li>Atacar debilita a un rival pero cuesta imagen frente a tu oponente de las elecciones generales. El dinero que sobra pasa a la campaña general.</li>\n<li>Si no terminas primero en delegados, tu campaña se acaba.</li></ul></details>\n<details><summary>Leer el mapa y las encuestas</summary><ul>\n<li><b>Colores:</b> azul para los demócratas, rojo para los republicanos. Cuanto más oscuro, mayor es la diferencia. Rayado: menos de 1,5 puntos, estado reñido.</li>\n<li><b>Encuestas:</b> con ruido, y con un sesgo común a todo el país. Un suceso te permite auditar ese sesgo.</li>\n<li><b>Encuesta interna (1 M$):</b> da el margen real del estado esa semana.</li>\n<li><b>Barra superior:</b> proyección para tu bando, tu rival y los estados reñidos. La línea marca 270.</li>\n<li><b>Punto dorado en una casilla:</b> tienes una oficina de campaña allí.</li>\n<li>Los márgenes iniciales proceden de los resultados de 2024, reajustados para que la carrera esté abierta.</li></ul></details>\n<details><summary>Acciones en un estado</summary><ul>\n<li><b>Anuncios:</b> cuestan 0,8 M$ más 0,1 M$ por voto electoral. Hasta unos +3 puntos, con rendimientos decrecientes. El efecto se reduce un 15% cada semana.</li>\n<li><b>Oficina de campo:</b> 1 acción y dinero. Hasta 3 por estado, unos +0,6, +1,0 y luego +1,4 puntos en total. Efecto duradero, pero el mantenimiento cuesta dinero cada semana.</li>\n<li><b>Visita:</b> 1 acción y 0,3 M$. +1,3 puntos de impacto mediático, que se reducen a la mitad cada semana.</li>\n<li>Tu rival dispone de las mismas palancas: lo que cuenta es la diferencia neta entre ambos.</li></ul></details>\n<details><summary>Acciones nacionales</summary><ul>\n<li><b>Recaudación de fondos:</b> 1 acción para obtener de 4 a 7 M$, algo más con buena imagen.</li>\n<li><b>Gran entrevista:</b> casi siempre buena para tu imagen, a veces sin efecto, rara vez un desliz.</li>\n<li><b>Preparación del debate:</b> hasta 3 niveles, se usa en los debates de la semana 5 y la semana 9, y luego vuelve a cero.</li>\n<li><b>Compañero de fórmula:</b> se elige al inicio, aporta una bonificación regional, de imagen o de fondos.</li></ul></details>\n<details><summary>Temas y posiciones</summary><ul>\n<li>Diez temas, cada uno con una <b>importancia</b> (barra dorada) y una <b>posición</b> de −2 a +2.</li>\n<li>Cambiar una posición o poner un tema en la agenda cuesta 1 acción.</li>\n<li>Cada estado reacciona según su población. Acercarte a los votantes de un estado te da puntos allí, pero te cuesta en otros.</li>\n<li>Alejarte de la línea de tu partido desmoviliza un poco a tu base, en todas partes.</li>\n<li>Cuando un tema gana importancia, favorece al bando que se le asocia: sanidad, aborto y clima se inclinan hacia los demócratas; inmigración, delincuencia y economía, hacia los republicanos.</li></ul></details>\n<details><summary>Grupos de votantes</summary><ul>\n<li>Siete grupos. Cada estado tiene su propia composición, que se muestra en su panel.</li>\n<li>Cada grupo tiene sus prioridades y prefiere un bando según tus posiciones (pestaña Grupos).</li>\n<li><b>Dirigirte a un grupo:</b> 1 acción y 1,5 M$. La bonificación se aplica en cada estado según el peso local del grupo y luego se reduce un 25% por semana. Tu rival también lo hace.</li></ul></details>\n<details><summary>Economía</summary><ul>\n<li>Cuentan tanto la coyuntura nacional como la economía de cada estado (sector, desempleo).</li>\n<li>Una buena economía ayuda al <b>partido en el poder</b>, una mala ayuda a su rival. El partido en el poder se indica en la pestaña Grupos.</li>\n<li>La energía y la industria reaccionan con más fuerza que los servicios. Los sucesos pueden afectar a un sector.</li></ul></details>\n<details><summary>Sucesos, imagen, debates</summary><ul>\n<li>Cada semana, un suceso pide una decisión, a menudo con un coste o un riesgo.</li>\n<li>Tu <b>imagen</b> frente a tu rival mueve un poco todos los estados.</li>\n<li>Dos debates (semanas 5 y 9) jugados pregunta a pregunta: tres preguntas sobre los temas del momento y una conclusión. Cada respuesta (atacar, detallar, contar una vivencia, volver a tu terreno) tiene su riesgo; detallar rinde en tus temas fuertes y volver a tu terreno rescata uno débil. Además, y una revelación de última hora (semana 11).</li></ul></details>\n<details><summary>Equipo de campaña</summary><ul>\n<li>La pestaña <b>Equipo</b> te permite contratar a 5 colaboradores: director de campaña, encuestador, director de campo, comunicación, finanzas. Cada uno tiene un nivel (I a III) y un salario semanal.</li>\n<li>Contratar cuesta una semana de salario por adelantado. Un nivel más alto cuesta más: te toca juzgar si el efecto compensa el salario.</li></ul></details>\n<details><summary>Medios, tormentas y voto anticipado</summary><ul>\n<li><b>Canales publicitarios:</b> la TV funciona en todas partes y dura más; lo digital es un 20% más barato pero se desvanece rápido y encaja con votantes jóvenes y universitarios; la radio local cuesta la mitad y encaja con zonas rurales, votantes negros y evangélicos. Los multiplicadores (×) muestran cuánto encaja cada canal con el estado.</li>\n<li><b>Tormentas:</b> cada semana puede traer una historia viral (a favor o en contra). Responder (1 acción) limita el daño o amplifica el beneficio.</li>\n<li><b>Voto anticipado:</b> desde la semana 8, una campaña (1 acción, 2 M$) asegura una bonificación duradera en un estado, hasta 3 veces. Cuenta más donde dominan los mayores y los graduados universitarios. Tu rival también lo hace.</li></ul></details>\n<details><summary>Candidato independiente y distritos</summary><ul>\n<li>En algunas partidas, un independiente entra hacia las semanas 3 a 5 y quita votos a un bando, y luego se desvanece. Si te perjudica, puedes cortejar a sus votantes o pedir el voto estratégico.</li>\n<li>Maine y Nebraska dividen sus votos electorales: 2 para el ganador del estado, 1 por distrito. El panel del estado muestra el margen en cada distrito.</li></ul></details>\n<details><summary>Modo de mitad de mandato (Cámara y Senado)</summary><ul>\n<li>Diriges la campaña nacional de tu partido. No hay candidatos, primarias ni debates.</li>\n<li>Cada estado elige varios <b>escaños de la Cámara</b> (el número se indica en el mapa); los estados marcados con ★ también celebran una <b>elección al Senado</b>. Los escaños que no se renuevan (34 demócratas, 31 republicanos) ya están contados.</li>\n<li>Necesitas <b>218 escaños de la Cámara</b> para ganar. Conseguir también el <b>Senado</b> (51 escaños; 50 bastan para el partido del presidente, y el vicepresidente desempata) es una victoria total.</li>\n<li>El partido del presidente suele salir penalizado. Tus palancas (anuncios, oficinas, temas, grupos, equipo) funcionan como en el juego presidencial, pero cuentan para todos los escaños del estado. Un escaño del Senado en manos del titular es algo más fácil de conservar.</li>\n<li>Los escaños del Senado en manos del titular son algo más fáciles de conservar, y el mapa del Senado favorece estructuralmente a los republicanos.</li></ul></details>\n<details><summary>Consejos</summary><ul>\n<li>Concéntrate en 6 a 8 estados reñidos, ponderados por votos electorales.</li>\n<li>Evita invertir en estados asegurados o perdidos por más de 10 puntos.</li>\n<li>Recauda fondos con regularidad y gástalo todo antes del día de las elecciones.</li>\n<li>Paga una encuesta interna antes de una gran inversión.</li>\n<li>Vigila el Registro: las acciones públicas de tu rival aparecen allí.</li>\n<li>En el Registro, “Mostrar cálculos detallados” desglosa el margen de cada estado.</li></ul></details>\n<details><summary>Después del escrutinio</summary><p>Si un estado decisivo se define por menos de medio punto: recuento (puedes pedirlo o defenderte, gastando más o menos dinero) y, si la diferencia sigue siendo mínima, recurso ante la Corte Suprema (6 jueces conservadores contra 3, lo que favorece al bando republicano). Si la mayoría depende de unos pocos votos electorales, los electores infieles pueden invertir el resultado. Estas decisiones cuestan dinero (y por tanto el logro «Caja intacta»).</p></details>\n<details><summary>Comodidad</summary><ul><li><b>↶ Deshacer</b>: el botón junto a ? deshace hasta 5 acciones de la semana en curso (no después de «Cerrar semana»).</li><li><b>Avance rápida</b> (pestaña Acciones): salta 1 semana, 3 semanas o hasta el día de las elecciones sin actuar; los eventos se resuelven de la forma más prudente.</li><li><b>Sonidos, música, animaciones</b>: sintetizados, ajustables o desactivables en Ajustes.</li></ul></details>\n<details><summary>Escenarios históricos</summary><p>Rejuega 2016, 2020 o 2024: el mapa usa los márgenes reales de cada estado, con la economía, los temas dominantes y el candidato independiente propios de cada año. Sin primarias; los candidatos siguen siendo ficticios. Ganar con el bando que perdió en la realidad desbloquea un logro.</p></details>\n<details><summary>Dificultad<p>En Fácil, el ambiente nacional te favorece. En Difícil, juega en tu contra y tu rival tiene más dinero.</p></details>";

}

 sal(id,dv){const i=ISSUES.findIndex(q=>q.id===id);G.sal[i]=clamp(G.sal[i]+dv,.1,1.6)},
 buzz(ab,v){const s=ST(ab);if(s)s.buzzP=Math.min(2.4,s.buzzP+v)},

};

function mapHTML(mode,rev){
  const grid=Array.from({length:8},()=>Array(11).fill(null));G.states.forEach(s=>grid[s.r][s.c]=s);

  for(let r=0;r<8;r++)for(let c=0;c<11;c++){const s=grid[r][c];if(!s){h+='<span></span>';continue}
    const fin=mode==='final',shown=!fin||rev.has(s.ab),m=fin?s.final:pollOf(s);
    const ts=shown?tileStyle(m):{bg:isDark()?'#232b3a':'#dde1e9',fg:'var(--muted)',tu:false};
    h+=`<button class="tile${!fin&&UI.sel===s.ab?' sel':''}${ts.tu?' tu':''}" ${fin?'tabindex="-1"':`data-act="sel" data-ab="${s.ab}"`} style="background:${ts.bg};color:${ts.fg}" aria-label="${sn(s)}, ${evLbl(s)}${shown?', '+fD(m):''}"><b>${s.ab}</b><small>${G.mode==='mid'?(s.hs||'–')+(s.sen?'★':''):s.ev}</small>${!fin&&s.fieldP?'<i class="pip"></i>':''}</button>`}
  return h+'</div>';
}

function finishMid(win,won,hM,sM){

function nightTick(first){

<details open><summary>Goal and flow</summary><p>You run a fictional 12-week presidential campaign, from August 14 to November 7, 2028. You need at least <b>270 of the 538 electoral votes</b>.</p>
<ul><li>Each week, you spend your <b>3 actions</b> and your money.</li><li>You end the week: your opponent plays, the economy moves, and an event asks you to choose.</li><li>On election night, results come in state by state with some randomness: polls can be wrong.</li></ul></details>
<details><summary>Candidates and primaries</summary><ul>
<li>You choose among <b>3 generated candidates</b>: two strengths and one weakness each (image, funds, cheaper offices, debates, home turf; risky interviews, baggage, low name ID).</li>
<li>The <b>primaries</b> are 4 contests (Super Tuesday counts the most). You get 2 actions per round: rally the base or court the center, ads ($4M), barnstorm, fundraise, attack a rival.</li>
<li>Primary voters have a <b>mood</b>, shown under the polls. Positioning near it helps, but your stance shifts your issue positions once you are nominated.</li>
<li>Attacking weakens a rival but costs image against your general-election opponent. Money left over carries into the general campaign.</li>
<li>If you do not finish first in delegates, your campaign ends.</li></ul></details>
<details><summary>Reading the map and polls</summary><ul>
<li><b>Colors:</b> blue for Democrats, red for Republicans. The darker, the bigger the gap. Hatched: under 1.5 points, a toss-up.</li>
<li><b>Polls:</b> noisy, with a bias shared across the whole country. One event lets you audit that bias.</li>
<li><b>Internal poll ($1M):</b> gives the state’s true margin for the week.</li>
<li><b>Top bar:</b> projection for your side, your opponent and toss-up states. The line marks 270.</li>
<li><b>Gold dot on a tile:</b> you have a campaign office there.</li>
<li>Starting margins come from the 2024 results, recalibrated so that the race is open.</li></ul></details>
<details><summary>Actions in a state</summary><ul>
<li><b>Ads:</b> cost $0.8M plus $0.1M per electoral vote. Up to about +3 points, with diminishing returns. The effect fades 15% each week.</li>
<li><b>Field office:</b> 1 action and money. Up to 3 per state, about +0.6, +1.0 then +1.4 points in total. Lasting effect, but upkeep costs money every week.</li>
<li><b>Visit:</b> 1 action and $0.3M. +1.3 points of buzz, halved each week.</li>
<li>Your opponent has the same levers: what matters is the net gap between you.</li></ul></details>
<details><summary>National actions</summary><ul>
<li><b>Fundraising:</b> 1 action for $4M to $7M, a bit more with a good image.</li>
<li><b>Major interview:</b> most often good for your image, sometimes no effect, rarely a slip.</li>
<li><b>Debate prep:</b> up to 3 levels, used at the week 5 and week 9 debates, then reset to zero.</li>
<li><b>Running mate:</b> chosen at the start, brings a regional bonus, image or funds.</li></ul></details>
<details><summary>Issues and positions</summary><ul>
<li>Ten issues, each with an <b>importance</b> (gold bar) and a <b>position</b> from −2 to +2.</li>
<li>Changing a position or putting an issue on the agenda costs 1 action.</li>
<li>Each state reacts according to its population. Moving toward a state’s voters wins you points there but costs you elsewhere.</li>
<li>Moving away from your party’s line demobilizes your base a little, everywhere.</li>
<li>When an issue gains importance, it favors the side associated with it: health care, abortion and climate lean Democratic; immigration, crime and the economy lean Republican.</li></ul></details>
<details><summary>Voter groups</summary><ul>
<li>Seven groups. Each state has its own makeup, shown in its panel.</li>
<li>Each group has its priorities and prefers a side depending on your positions (Groups tab).</li>
<li><b>Targeting a group:</b> 1 action and $1.5M. The bonus applies in each state according to the group’s local weight, then fades 25% per week. Your opponent does it too.</li></ul></details>
<details><summary>Economy</summary><ul>
<li>National conditions and each state’s economy (sector, unemployment) both matter.</li>
<li>A good economy helps the <b>incumbent party</b>, a bad one helps its challenger. The incumbent party is shown in the Groups tab.</li>
<li>Energy and manufacturing react more strongly than services. Events can hit a sector.</li></ul></details>
<details><summary>Events, image, debates</summary><ul>
<li>Each week, an event asks for a choice, often with a cost or a risk.</li>
<li>Your <b>image</b> against your opponent moves every state a little.</li>
<li>Two debates (weeks 5 and 9), played question by question: three questions on the hot issues, then a closing statement. Each answer (attack, lay out a plan, tell a story, pivot) has its own risk; a plan pays off on your strong issues, a pivot rescues a weak one. and a last-minute revelation (week 11).</li></ul></details>
<details><summary>Campaign staff</summary><ul>
<li>The <b>Team</b> tab lets you hire 5 staffers: campaign manager, pollster, field director, communications, finance. Each has a level (I to III) and a weekly salary.</li>
<li>Hiring costs one week of salary up front. A higher level costs more: it is up to you to judge whether the effect pays for the salary.</li></ul></details>
<details><summary>Media, storms and early voting</summary><ul>
<li><b>Ad channels:</b> TV works everywhere and lasts longer; digital is 20% cheaper but fades fast and suits young and college-educated voters; local radio costs half as much and suits rural areas, Black and evangelical voters. The multipliers (×) show how well each channel fits the state.</li>
<li><b>Storms:</b> each week may bring a viral story (for or against you). Responding (1 action) limits the damage or amplifies the benefit.</li>
<li><b>Early voting:</b> from week 8, a drive (1 action, $2M) banks a lasting bonus in a state, up to 3 times. It counts more where seniors and college graduates dominate. Your opponent does it too.</li></ul></details>
<details><summary>Independent candidate and districts</summary><ul>
<li>In some games an independent enters around weeks 3 to 5 and takes votes from one side, then fades. If it hurts you, you can court its voters or urge strategic voting.</li>
<li>Maine and Nebraska split their electoral votes: 2 for the statewide winner, 1 per district. The state panel shows the margin in each district.</li></ul></details>
<details><summary>Midterms mode (House and Senate)</summary><ul>
<li>You run your party’s national campaign. There are no candidates, primaries or debates.</li>
<li>Each state elects several <b>House seats</b> (the number is shown on the map); states marked ★ also hold a <b>Senate election</b>. Seats not up for election (34 Democratic, 31 Republican) are already counted.</li>
<li>You need <b>218 House seats</b> to win. Taking the <b>Senate</b> too (51 seats; 50 is enough for the president’s party, the vice-president breaking ties) is a total victory.</li>
<li>The president’s party is usually penalized. Your levers (ads, offices, issues, groups, staff) work as in the presidential game, but count for every seat in the state. An incumbent Senate seat is a little easier to hold.</li>
<li>Incumbent Senate seats are a little easier to hold, and the Senate map structurally favors Republicans.</li></ul></details>
<details><summary>Tips</summary><ul>
<li>Focus on 6 to 8 close states, weighted by electoral votes.</li>
<li>Avoid investing in states that are locked or lost by more than 10 points.</li>
<li>Fundraise regularly and spend everything before election day.</li>
<li>Pay for an internal poll before a big investment.</li>
<li>Watch the Log: your opponent’s public actions appear there.</li>
<li>In the Log, “Show detailed calculations” breaks down each state’s margin.</li></ul></details>
<details><summary>After election night</summary><p>If a decisive state is within half a point: a recount (you can request one or defend, spending more or less money), then, if the margin stays razor-thin, an appeal to the Supreme Court (6 conservative justices to 3, which favors the Republican side). If the majority rests on a few electoral votes, faithless electors can reverse the result. These choices cost money (and so the “Spare change” achievement).</p></details>
<details><summary>Comfort</summary><ul><li><b>↶ Undo</b>: the button next to ? undoes up to 5 actions of the current week (not after “End week”).</li><li><b>Fast-forward</b> (Actions tab): skip 1 week, 3 weeks or straight to election day without acting; events are settled the safest way.</li><li><b>Sound, music, animations</b>: synthesized, adjustable or switched off in Settings.</li></ul></details>
<details><summary>Historical scenarios</summary><p>Replay 2016, 2020 or 2024: the map uses each state’s real margins, with the year’s economy, dominant issues and independent candidate. No primaries; candidates remain fictional. Winning with the side that actually lost unlocks an achievement.</p></details>
<details><summary>Difficulty</summary><p>On Easy, the national mood favors you. On Hard, it works against you and your opponent has more money.</p></details>`+foot;
}

function debStart(){

function debQuestion(){const d=G.ev.deb;return d.q<3?{topic:ISSUES[d.qs[d.q]],set:DEB_TOPIC}:{topic:null,set:DEB_CLOSE}}
function debAnswer(i){
  const d=G.ev.deb,Q=debQuestion(),a=Q.set[i];if(!a)return;
  let m=a.m+PARAM.prep*G.prep/2+(trP().includes('debate')?.075:0)-(trO().includes('debate')?.075:0),sd=a.sd;
  if(Q.topic){
    const fav=G.me*Q.topic.own>.15,unf=G.me*Q.topic.own<-.15;

function autoEvent(){
  const e=EVENTS.find(q=>q.id===G.ev.id);let r;
  if(e.id==='debate'){debAuto(2);r=G.ev.res}
  else{let i=e.ch.findIndex(c=>c.d===FREE);if(i<0)i=e.ch.length-1;r=e.ch[i].fx();G.ev.res=r;L('news',B(`${e.t.fr} : ${r.fr}`,`${e.t.en}: ${r.en}`,`${e.t.es||e.t.en}: ${r.es||r.en}`))}
  A.evnext();
}
function runAuto(n){
  for(let i=0;i<n&&G&&G.phase==='play';i++){
    endWeek();
    let guard=0;while(G&&G.phase==='event'&&guard++<4)autoEvent();
  }
  UNDO.clear();save();render();
}
A.auto=function(d){
  if(!can())return;const n=+d.n,left=13-G.wk;
  if(n===1)return runAuto(1);
  const k=Math.min(n,left);
  showModal(`<h2>${t('Simulation accélérée','Fast-forward','Avance rápida')}</h2><p>${t(`Passer ${k>=left?'jusqu’à l’élection':k+' semaines'} sans agir : vos ressources restent en banque et les événements sont résolus de la façon la plus prudente. L’adversaire, lui, continue.`,`Skip ${k>=left?'to election day':k+' weeks'} without acting: your resources stay in the bank and events are settled the safest way. Your opponent keeps going.`,`Avanzar ${k>=left?'hasta el día de las elecciones':k+' semanas'} sin actuar: tus recursos se quedan en el banco y los eventos se resuelven de la forma más prudente. Tu rival sigue adelante.`)}</p><button class="btn full" data-act="autogo" data-n="${k}">${t('Confirmer','Confirm','Confirmar')}</button><button class="btn alt full" style="margin-top:8px" data-act="closeHelp">${t('Annuler','Cancel','Cancelar')}</button>`);
};
A.autogo=function(d){hideModal();runAuto(+d.n)};
const autoHTML=()=>`<div class="card"><div><h3>${t('Simulation accélérée','Fast-forward','Avance rápida')}</h3><p>${t('Passez des semaines sans agir (les événements sont réglés au plus prudent).','Skip weeks without acting (events are settled the safest way).','Avanza semanas sin actuar (los eventos se resuelven de la forma más prudente).')}</p></div><div class="irow"><button class="btn sm alt" data-act="auto" data-n="1">+1</button><button class="btn sm alt" data-act="auto" data-n="3">+3</button><button class="btn sm alt" data-act="auto" data-n="12">${t('Fin','End','Fin')}</button></div></div>`;

// ---- Animations de carte : une tuile qui change de couleur pulse
let _tilePrev=null,_tileKey='';
function animTiles(){
  if(SIM||!SET.anim)return;
  const tiles=[...document.querySelectorAll('.map .tile')];if(!tiles.length){_tilePrev=null;return}
  const sig=tiles.map(b=>b.style.background),key=(G&&G.seed)+'|'+(UI&&UI.night?'n':'p');
  if(_tilePrev&&_tileKey===key&&_tilePrev.length===sig.length)sig.forEach((v,i)=>{if(v!==_tilePrev[i])tiles[i].classList.add('pulse')});
  _tilePrev=sig;_tileKey=key;
}
{const r0=render;render=function(){r0();animTiles()}}

// ---- Sons et musique (synthétisés, aucun fichier ; désactivables dans les réglages)
const SND=(()=>{
  let ctx=null,master=null,musTimer=null,step=0;
  const ok=()=>{try{if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ctx=new C();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return true}catch(e){return false}};
  const tone=(f,d,type='sine',v=.12,at=0,to=null)=>{const t0=ctx.currentTime+at,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.05)};
  const FX={
    click(){tone(720,.06,'triangle',.07)},
    coin(){tone(988,.08,'square',.05);tone(1319,.16,'square',.05,.07)},
    tick(){tone(520,.04,'triangle',.05)},
    undo(){tone(600,.12,'sine',.08,0,300)},
    end(){tone(300,.3,'sawtooth',.04,0,90)},
    alert(){tone(660,.12,'triangle',.09);tone(880,.2,'triangle',.09,.12)},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.1,i*.14))},
    lose(){[392,349,311,262].forEach((f,i)=>tone(f,.45,'sine',.1,i*.2))}
  };
  const CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
  const music=()=>{const c=CH[Math.floor(step/8)%4],i=step%8;
    if(i===0)c.forEach(f=>tone(f/2,3.2,'triangle',.035));
    if(i%2===0)tone(c[(i/2)%3]*2,.9,'sine',.03);step++};
  return{
    play(n){if(SIM||!SET.snd||!FX[n]||!ok())return;try{FX[n]()}catch(e){}},
    sync(){
      if(SIM)return;
      if(SET.mus&&ok()){if(!musTimer)musTimer=setInterval(()=>{if(!document.hidden&&SET.mus)music()},420)}
      else if(musTimer){clearInterval(musTimer);musTimer=null}
    }
  };
})();
// sounds attached to actions, events and election night
const _sfx={ads:'coin',fund:'coin',field:'coin',visit:'click',poll:'click',pos:'click',agenda:'click',media:'click',prep:'click',target:'click',early:'click',hire:'click',fire:'click',end:'end',choose:'click',dans:'click',dstart:'click',vp:'click',tab:'click',sel:'tick'};
Object.keys(_sfx).forEach(k=>{const f=A[k];if(!f)return;A[k]=function(...a){SND.play(_sfx[k]);return f.apply(this,a)}});
{const se=showEvent;showEvent=function(){const fresh=G&&G.phase==='event'&&G.ev&&G.ev.res===null&&!G.ev.deb;se();if(fresh)SND.play('alert')}}
{const nt=nightTick;nightTick=function(first){nt(first);if(UI.night&&G){if(UI.night.idx<G.order.length)SND.play('tick');else if(!G.sndDone&&G.win!=null){G.sndDone=1;SND.play(G.win?'win':'lose')}}}}
document.addEventListener('click',()=>SND.sync(),{once:false});
/* ---------- Après le scrutin : recomptage, Cour suprême, électeurs infidèles ---------- */
// Triggered at the end of election night (presidential modes only) when the result is razor-thin.
const COURT={R:.45,D:.18}; // chance a litigant wins in court (6–3 conservative bench): by litigant's party
function pTally(){let d=0,r=0;G.states.forEach(s=>comps(s).forEach((k,i)=>{if(s.final+(s.dn?s.dn[i]:0)>0)d+=k[0];else r+=k[0]}));if(G.fl){d+=G.fl.d||0;r+=G.fl.r||0}
  return{d,r,mine:G.me===1?d:r,theirs:G.me===1?r:d}}
function pDecisive(maxAbs){
  const T=pTally();let best=null;
  G.states.forEach(s=>{if(DIST[s.ab]||Math.abs(s.final)>=maxAbs)return;
    const mineNow=(s.final>0?1:-1)===G.me,after=mineNow?T.mine-s.ev:T.mine+s.ev;
    if((T.mine>=270)!==(after>=270)&&(!best||Math.abs(s.final)<Math.abs(best.final)))best=s});
  return best}
function pois(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=rnd()}while(p>L&&k<8);return k-1}
// which step comes next (null = nothing more to do)
function pNext(){
  const p=G.post,T=pTally();
  if(!p.rc){const s=pDecisive(.5);if(s)return{k:'rc',ab:s.ab}}
  if(!p.ct){const s=pDecisive(.2);if(s&&p.rc!=='skip')return{k:'ct',ab:s.ab}}
  if(!p.fe&&Math.max(T.d,T.r)<=282&&Math.max(T.d,T.r)>=270)return{k:'fe'};
  return null}
function postPending(){
  if(SIM||G.mode==='mid')return false;
  if(!G.post){G.post={log:[],cur:null,rc:0,ct:0,fe:0,fin:false}}
  const p=G.post;if(p.fin)return false;
  if(!p.cur){const n=pNext();if(!n){
      // cosmetic: a stray faithless elector
      if(!p.fe&&rnd()<.25){const k=1+(rnd()<.3?1:0);p.log.push(B(`${k} grand(s) électeur(s) rompent la consigne de leur État, sans conséquence sur le résultat.`,`${k} elector${k>1?'s':''} break${k>1?'':'s'} with their state’s vote, with no effect on the outcome.`,`${k} elector${k>1?'es':''} rompe${k>1?'n':''} con el voto de su estado, sin consecuencias para el resultado.`));p.fe=1}
      p.fin=true;return false}p.cur=n}
  return true}
function pWho(s){const mineNow=(s.final>0?1:-1)===G.me;return{defending:mineNow,dir:mineNow?-G.me:G.me}} // dir = direction (D=+1) of the challenger
function showPost(){
  const p=G.post,c=p.cur,title=t('Après le scrutin','After election night','Después del escrutinio');
  let h=`<h2>${title}</h2>`;
  if(c.res){showModal(h+`<div class="res">${t(c.res)}</div><button class="btn full" data-act="postnext">${t('Continuer','Continue','Continuar')}</button>`);return}
  const ch=(i,a,b,cost)=>`<button class="ch" data-act="postch" data-i="${i}"><b>${t(a)}</b><small>${t(b)}${cost?' · '+fm0(cost):''}</small></button>`;
  if(c.k==='rc'){const s=ST(c.ab),w=pWho(s);
    h+=`<p>${t(`${sn(s)} se joue à ${f1(Math.abs(s.final))} point d’écart et ce seul État décide de la présidence. Le recomptage automatique est ouvert.`,`${sn(s)} is within ${f1(Math.abs(s.final))} points, and that one state decides the presidency. An automatic recount is under way.`,`${sn(s)} se decide por ${f1(Math.abs(s.final))} puntos y ese único estado define la presidencia. Se abre un recuento automático.`)}</p>`;
    h+=w.defending?ch(0,B('Rester calme','Stay calm','Mantener la calma'),B('Le décompte suit son cours','The count runs its course','El recuento sigue su curso'))+ch(1,B('Équipe juridique','Legal defense','Equipo jurídico'),B('Limite les basculements','Limits swings against you','Limita los vuelcos en tu contra'),3)
      :ch(0,B('Reconnaître la défaite','Concede','Reconocer la derrota'),B('Fin de l’histoire','Case closed','Caso cerrado'))+ch(1,B('Demander un recomptage','Request a recount','Pedir un recuento'),B('Chances modestes','Modest odds','Posibilidades modestas'),2)+ch(2,B('Offensive totale','All-out challenge','Ofensiva total'),B('Meilleures chances','Best odds','Mejores posibilidades'),6)}
  else if(c.k==='ct'){const s=ST(c.ab),w=pWho(s);
    h+=`<p>${t(`Le recomptage ne tranche pas : ${sn(s)} reste à ${f1(Math.abs(s.final))} point. La contestation arrive devant la Cour suprême (6 juges conservateurs contre 3).`,`The recount settles nothing: ${sn(s)} stays within ${f1(Math.abs(s.final))} point. The dispute lands before the Supreme Court (6 conservative justices to 3).`,`El recuento no resuelve nada: ${sn(s)} sigue a ${f1(Math.abs(s.final))} punto. La disputa llega a la Corte Suprema (6 jueces conservadores contra 3).`)}</p>`;
    h+=w.defending?ch(0,B('Laisser la Cour trancher','Let the Court rule','Dejar que la Corte decida'),B('Sans renfort','No extra help','Sin refuerzos'))+ch(1,B('Mobiliser les meilleurs avocats','Bring in top litigators','Reunir a los mejores abogados'),B('Réduit le risque','Reduces the risk','Reduce el riesgo'),4)
      :ch(0,B('Renoncer','Drop it','Renunciar'),B('Accepter le résultat','Accept the result','Aceptar el resultado'))+ch(1,B('Saisir la Cour','Take it to court','Acudir a la Corte'),B('Pari judiciaire','A legal gamble','Una apuesta judicial'),4)}
  else{const T=pTally(),win=T.mine>=270;
    h+=`<p>${win?t(`Votre avance tient à ${T.mine-269} grand(s) électeur(s) : l’adversaire fait pression sur les électeurs de votre camp avant le vote du collège.`,`Your lead rests on ${T.mine-269} electoral vote${T.mine-269>1?'s':''}: your opponent is pressuring your electors before the college votes.`,`Tu ventaja depende de ${T.mine-269} voto${T.mine-269>1?'s':''} electoral${T.mine-269>1?'es':''}: tu rival presiona a tus electores antes de la votación del colegio.`):t('L’écart est de quelques grands électeurs : des électeurs adverses pourraient rompre la consigne.','The gap is a handful of electoral votes: some opposing electors might break ranks.','La diferencia es de unos pocos votos electorales: algunos electores rivales podrían romper la disciplina.')}</p>`;
    h+=win?ch(0,B('Laisser faire','Do nothing','No hacer nada'),B('Risque de défections','Risk of defections','Riesgo de deserciones'))+ch(1,B('Verrouiller vos électeurs','Lock down your electors','Blindar a tus electores'),B('Limite les défections','Limits defections','Limita las deserciones'),3)
      :ch(0,B('Laisser le collège voter','Let the college vote','Dejar que vote el colegio'),B('Rien de plus à faire','Nothing more to do','Nada más que hacer'))+ch(1,B('Courtiser les électeurs adverses','Lobby opposing electors','Cortejar a electores rivales'),B('Zone grise, résultat incertain','Gray area, uncertain payoff','Zona gris, resultado incierto'),4)}
  showModal(h);
}
A.postch=function(x){
  const p=G.post,c=p.cur,i=+x.i,T0=pTally();
  if(c.k==='rc'){const s=ST(c.ab),w=pWho(s);p.rc=1;let res;
    const cost=w.defending?[0,3][i]:[0,2,6][i];G.cash=Math.max(0,G.cash-cost);
    if(!w.defending&&i===0){res=B('Vous reconnaissez votre défaite.','You concede the race.','Reconoces la derrota.');p.rc='skip'}
    else{
      let sh=randn()*.14+(w.defending?.05:[0,.04,.09][i]);if(w.defending&&i===1&&sh>0)sh*=.5;
      const before=Math.sign(s.final);s.final+=w.dir*sh;const flipped=Math.sign(s.final)!==before;
      if(flipped){if(w.defending){res=B(`Le recomptage fait basculer ${sn(s).replace(/^/,'')} : le résultat s’inverse.`,`The recount flips ${sn(s)}: the result reverses.`,`El recuento vuelca ${sn(s)}: el resultado se invierte.`)}else{res=B(`Le recomptage vous donne ${sn(s)} : le résultat s’inverse en votre faveur !`,`The recount gives you ${sn(s)}: the result flips your way!`,`¡El recuento te da ${sn(s)}: el resultado se invierte a tu favor!`);p.wonRecount=1}}
      else res=B(`Le recomptage confirme le résultat dans ${sn(s)} (écart ${f1(Math.abs(s.final))} point).`,`The recount confirms the result in ${sn(s)} (${f1(Math.abs(s.final))} point margin).`,`El recuento confirma el resultado en ${sn(s)} (diferencia de ${f1(Math.abs(s.final))} punto).`);
      p.rcFlip=flipped}
    c.res=res;p.log.push(res);
  }else if(c.k==='ct'){const s=ST(c.ab),w=pWho(s);p.ct=1;let res;
    G.cash=Math.max(0,G.cash-(w.defending?[0,4][i]:[0,4][i]));
    if(!w.defending&&i===0){res=B('Vous renoncez à contester. Le résultat est acquis.','You drop the challenge. The result stands.','Renuncias a impugnar. El resultado queda firme.')}
    else{
      const chal=w.dir===1?'D':'R';let pr=COURT[chal];if(w.defending&&i===1)pr-=.08;
      if(rnd()<pr){s.final=w.dir*.02;res=w.defending?B(`La Cour suprême donne ${sn(s)} à l’adversaire, 6 voix contre 3. Le résultat bascule.`,`The Supreme Court hands ${sn(s)} to your opponent, 6–3. The result flips.`,`La Corte Suprema le da ${sn(s)} a tu rival, 6 a 3. El resultado se invierte.`):B(`La Cour suprême vous donne raison dans ${sn(s)}, 6 voix contre 3. Le résultat bascule en votre faveur !`,`The Supreme Court rules your way in ${sn(s)}, 6–3. The result flips in your favor!`,`La Corte Suprema te da la razón en ${sn(s)}, por 6 a 3. ¡El resultado se invierte a tu favor!`);p.wonCourt=!w.defending;p.lostCourt=w.defending}
      else res=w.defending?B('La Cour suprême rejette le recours de l’adversaire. Le résultat est confirmé.','The Supreme Court rejects your opponent’s appeal. The result is confirmed.','La Corte Suprema rechaza el recurso de tu rival. El resultado se confirma.'):B('La Cour suprême rejette votre recours. Le résultat est confirmé.','The Supreme Court rejects your appeal. The result is confirmed.','La Corte Suprema rechaza tu recurso. El resultado se confirma.')}
    c.res=res;p.log.push(res);
  }else{
    const win=T0.mine>=270;p.fe=1;G.cash=Math.max(0,G.cash-(i===1?(win?3:4):0));
    const lam=win?(i===1?.3:1.0):(i===1?1.0:0);let k=lam?pois(lam):0;
    const gap=win?T0.mine-269:269-T0.mine+1;k=Math.min(k,6);
    let res;
    if(!k)res=B('Aucun électeur ne rompt la consigne. Le collège confirme le résultat.','No elector breaks ranks. The college confirms the result.','Ningún elector rompe la disciplina. El colegio confirma el resultado.');
    else{
      // k electors move from the leader to the other side
      const leaderD=T0.d>T0.r;G.fl=G.fl||{d:0,r:0};if(leaderD){G.fl.d-=k;G.fl.r+=k}else{G.fl.r-=k;G.fl.d+=k}
      const T1=pTally(),rev=(T1.mine>=270)!==(T0.mine>=270);
      res=B(`${k} grand(s) électeur(s) rompent la consigne.${rev?' Le résultat s’inverse !':' Le résultat tient.'}`,`${k} elector${k>1?'s':''} break${k>1?'':'s'} ranks.${rev?' The result reverses!':' The result holds.'}`,`${k} elector${k>1?'es':''} rompe${k>1?'n':''} la disciplina.${rev?' ¡El resultado se invierte!':' El resultado se mantiene.'}`);
      if(rev&&!win)p.wonFE=1}
    c.res=res;p.log.push(res);
  }
  save();showPost();
};
A.postnext=function(){const p=G.post;p.cur=null;save();if(postPending())showPost();else nightTick()};
</script>
